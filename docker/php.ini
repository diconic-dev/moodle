; Moodle-oriented PHP tuning for the container runtime.

[PHP]
; Moodle recommends 256M minimum; 512M gives headroom for large course restores.
memory_limit = 512M
max_execution_time = 600
max_input_time = 600
max_input_vars = 5000
post_max_size = 256M
upload_max_filesize = 256M
; Moodle validation is strict about these.
default_charset = "UTF-8"
date.timezone = UTC
; Never leak paths or errors to the browser in production images.
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
expose_php = Off
; Sessions are stored in dataroot by Moodle's own handler, not by PHP.
session.auto_start = 0
session.save_handler = files
cgi.fix_pathinfo = 0

[opcache]
; Application code is immutable inside the image, so timestamp validation is
; pure overhead. Anything that must be picked up live (plugin install) triggers
; an explicit opcache reset from Moodle's admin UI.
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
opcache.revalidate_freq = 0
opcache.save_comments = 1
opcache.fast_shutdown = 1

[realpath_cache]
realpath_cache_size = 4096K
realpath_cache_ttl = 600