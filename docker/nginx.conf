# nginx front-controller for Moodle.
#
# Code is read-only here: nginx only serves static assets and proxies PHP.
# webroot = public/, but Moodle's config.php lives one level up — see the
# SCRIPT_FILENAME / document_root split below.

upstream moodle_php {
    server app:9000;
}

server {
    listen 80;
    listen [::]:80;

    # Must match MOODLE_WWWROOT exactly, otherwise redirects and generated
    # asset URLs break.
    server_name _;

    # Physical path inside the app image where the code lives.
    root /var/www/moodle/public;

    index index.php;

    charset utf-8;
    client_max_body_size 256M;

    # Preserve client IP / proto for reverse-proxy setups.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ---------------------------------------------------------------------
    # Static assets: served by nginx, long cache, never executed.
    # ---------------------------------------------------------------------
    location ~* \.(?:css|js|mjs|map|woff2?|ttf|eot|otf|svg|png|jpe?g|gif|webp|avif|ico|mp4|webm|mp3|ogg|wav)$ {
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        # Defence in depth: refuse to execute anything that lands here.
        location ~* \.php$ { deny all; }
    }

    # Moodle requires this path to be non-cacheable (dynamic plugin files).
    location /theme/ {
        try_files $uri =404;
    }

    # ---------------------------------------------------------------------
    # PHP via FastCGI.
    # SCRIPT_FILENAME is built from the real document root so that files under
    # public/ resolve correctly, while config.php at the repo root stays inside
    # dirroot (Moodle reads it from there, never over HTTP).
    # ---------------------------------------------------------------------
    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        try_files $fastcgi_script_name =404;

        fastcgi_pass moodle_php;
        fastcgi_index index.php;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO       $fastcgi_path_info;
        fastcgi_param DOCUMENT_ROOT   $document_root;

        # Moodle-friendly timeouts for long operations (backups, restores).
        fastcgi_read_timeout 600s;
        fastcgi_send_timeout 600s;
        fastcgi_connect_timeout 10s;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 8 128k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_intercept_errors off;

        # Let Moodle handle its own security headers.
        fastcgi_param HTTP_PROXY "";
    }

    # ---------------------------------------------------------------------
    # Do not expose source-only or hidden paths.
    # ---------------------------------------------------------------------
    location ~ ^/(vendor|docker|node_modules)/ { deny all; }
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(?:md|json|lock|dist|xml|lockb)$ {
        # Allow composer.json-style probes only where needed; deny inside app dirs.
        location ~ ^/(vendor|docker)/ { deny all; }
    }

    # Health endpoint for orchestrators / load balancers.
    location = /_health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Logs
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Basic hardening.
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}