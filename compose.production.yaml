# Moodle production stack.
#
# Deploy:
#   docker compose -f compose.production.yaml pull
#   docker compose -f compose.production.yaml up -d
#
# MOODLE_IMAGE_TAG should be an immutable release tag, for example 5.3.1.

name: moodle

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MOODLE_DB_NAME:-moodle}
      MARIADB_USER: ${MOODLE_DB_USER:-moodle}
      MARIADB_PASSWORD: ${MOODLE_DB_PASSWORD:?set MOODLE_DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${MOODLE_DB_ROOT_PASSWORD:?set MOODLE_DB_ROOT_PASSWORD in .env}
      MARIADB_AUTO_UPGRADE: "1"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-file-per-table=1
      - --skip-log-bin
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - moodle

  app:
    image: ${MOODLE_IMAGE:-ghcr.io/diconic-dev/moodle}:${MOODLE_IMAGE_TAG:-5.3.1}
    pull_policy: always
    restart: unless-stopped
    environment:
      MOODLE_DB_TYPE: mariadb
      MOODLE_DB_HOST: db
      MOODLE_DB_PORT: "3306"
      MOODLE_DB_NAME: ${MOODLE_DB_NAME:-moodle}
      MOODLE_DB_USER: ${MOODLE_DB_USER:-moodle}
      MOODLE_DB_PASSWORD: ${MOODLE_DB_PASSWORD:?set MOODLE_DB_PASSWORD in .env}
      MOODLE_WWWROOT: ${MOODLE_WWWROOT:?set MOODLE_WWWROOT in .env}
      MOODLE_DATAROOT: /var/www/moodledata
      MOODLE_SITE_LANG: ${MOODLE_SITE_LANG:-en}
      MOODLE_REVERSEPROXY: ${MOODLE_REVERSEPROXY:-1}
      MOODLE_SSLPROXY: ${MOODLE_SSLPROXY:-1}
      TZ: ${TZ:-UTC}
    volumes:
      - moodledata:/var/www/moodledata
    depends_on:
      db:
        condition: service_healthy
    networks:
      - moodle

  web:
    image: ${MOODLE_WEB_IMAGE:-ghcr.io/diconic-dev/moodle}:${MOODLE_IMAGE_TAG:-5.3.1}-web
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${MOODLE_HTTP_PORT:-8080}:80"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - moodle

  cron:
    image: ${MOODLE_IMAGE:-ghcr.io/diconic-dev/moodle}:${MOODLE_IMAGE_TAG:-5.3.1}
    pull_policy: always
    restart: unless-stopped
    environment:
      MOODLE_DB_TYPE: mariadb
      MOODLE_DB_HOST: db
      MOODLE_DB_PORT: "3306"
      MOODLE_DB_NAME: ${MOODLE_DB_NAME:-moodle}
      MOODLE_DB_USER: ${MOODLE_DB_USER:-moodle}
      MOODLE_DB_PASSWORD: ${MOODLE_DB_PASSWORD:?set MOODLE_DB_PASSWORD in .env}
      MOODLE_WWWROOT: ${MOODLE_WWWROOT:?set MOODLE_WWWROOT in .env}
      MOODLE_DATAROOT: /var/www/moodledata
      TZ: ${TZ:-UTC}
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          sleep 60
          php /var/www/moodle/admin/cli/cron.php || echo "[cron] run failed, retrying next minute"
        done
    volumes:
      - moodledata:/var/www/moodledata
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
    networks:
      - moodle

volumes:
  dbdata:
  moodledata:

networks:
  moodle:
