name: Build container image

# Builds the Moodle image and, when credentials are available, pushes it to
# GitHub Container Registry. Pull requests build only — never push.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Default to read-only; the push job opts into packages: write explicitly.
permissions:
  contents: read

concurrency:
  # One build per ref. Cancel superseded runs so a fast follow-up commit does
  # not queue behind a stale multi-minute build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # Cheap checks first: fail in seconds, not after a long image build.
  # ---------------------------------------------------------------------------
  lint:
    name: Validate Docker config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Shell script syntax
        run: |
          # Present on ubuntu-latest runners already; install only if missing.
          # (Avoid starting a comment with the tool's own name: shellcheck
          # reads "# shellcheck ..." as an inline directive.)
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck
          fi
          shellcheck -s sh --severity=warning \
            docker/entrypoint.sh docker/healthcheck.sh

      - name: nginx config syntax
        # The upstream "app:9000" is unresolvable outside the compose network,
        # so it is stubbed before running nginx -t.
        run: |
          mkdir -p /tmp/nginx-check
          sed 's|server app:9000;|server 127.0.0.1:9000;|' docker/nginx.conf \
            > /tmp/nginx-check/default.conf
          docker run --rm \
            -v /tmp/nginx-check/default.conf:/etc/nginx/conf.d/default.conf:ro \
            nginx:1.27-alpine nginx -t

      - name: compose.yaml is valid
        run: |
          cp .env.example .env
          # Required secrets are read from .env; the example file supplies
          # placeholders so `config` can interpolate without real credentials.
          docker compose config --quiet

  # ---------------------------------------------------------------------------
  # Build (and push, when we may).
  # ---------------------------------------------------------------------------
  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        # Skip on PRs from forks: they have no access to secrets, and pushing
        # from an untrusted PR would be a supply-chain risk.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            # main            -> latest + edge
            # v1.2.3 tag      -> 1.2.3, 1.2, 1, latest
            # pull request    -> pr-<number>
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=edge,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract Moodle version for labels
        id: moodle
        run: |
          # version.php sits under public/ in the 5.3 layout and looks like:
          #   $release = '5.3.1 (Build: 20261112)';
          # The OCI label wants just the semver, so the build suffix is stripped.
          # No shell variable expansion is involved: the release line is matched
          # by its fixed leading text, then the text between the first pair of
          # single quotes is taken. This keeps it portable to runners without a
          # PHP CLI.
          RELEASE=$(sed -n "s/^[[:space:]]*\$release[[:space:]]*=[[:space:]]*'\\([^']*\\)'.*/\\1/p" \
                      public/version.php | head -1)
          # Strip the build suffix: "5.3.1 (Build: 20261112)" -> "5.3.1"
          RELEASE=$(printf '%s' "$RELEASE" | sed 's/[[:space:]]*(Build:.*//')
          echo "release=${RELEASE:-unknown}" >> "$GITHUB_OUTPUT"

      # Step 1: build into the local daemon only, so the smoke test can inspect
      # the exact artefact before anything is published. A failing test must
      # never leave a broken tag on the registry.
      - name: Build image (local only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          load: true
          # Prefixed local-only name: a bare "moodle:ci" tag would be resolved
          # against Docker Hub during push and fail authorization.
          tags: local/moodle:ci
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.title=Moodle
            org.opencontainers.image.version=${{ steps.moodle.outputs.release }}
          # Warm cache between runs so a code-only change does not re-run
          # composer install from scratch.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the built image
        run: |
          IMG=local/moodle:ci
          # php-fpm binary present and executable
          docker run --rm --entrypoint php "$IMG" -v
          # Moodle source readable and version file intact
          docker run --rm --entrypoint sh "$IMG" -c 'test -r /var/www/moodle/public/index.php'
          docker run --rm --entrypoint sh "$IMG" -c 'test -r /var/www/moodle/public/version.php'
          # Every extension Moodle requires must be loaded
          docker run --rm --entrypoint php "$IMG" -r '
            $required = ["ctype","curl","dom","exif","fileinfo","gd","hash","iconv","intl","json","mbstring","mysqli","openssl","pcre","simplexml","soap","sodium","spl","tokenizer","xml","xmlreader","zip","zlib"];
            $have = array_map("strtolower", get_loaded_extensions());
            $missing = array_values(array_diff($required, $have));
            if ($missing) { fwrite(STDERR, "missing extensions: ".implode(", ", $missing)."\n"); exit(1); }
            echo "all required extensions present\n";
          '
          # Entrypoint and healthcheck must be executable
          docker run --rm --entrypoint sh "$IMG" -c 'test -x /usr/local/bin/moodle-entrypoint'
          docker run --rm --entrypoint sh "$IMG" -c 'test -x /usr/local/bin/moodle-healthcheck'

      - name: Report image size
        run: |
          docker image inspect local/moodle:ci --format '{{.Size}}' \
            | awk '{printf "image size: %.1f MB\n", $1/1024/1024}'

      # Step 2: publish. Only reached when the smoke test above passed, and
      # never on a pull request.
      - name: Push to GitHub Container Registry
        if: github.event_name != 'pull_request'
        run: |
          for tag in $(echo "${{ steps.meta.outputs.tags }}" | tr ',' ' '); do
            echo "pushing $tag"
            docker tag local/moodle:ci "$tag"
            docker push "$tag"
          done

      - name: Build and push nginx image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: web
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.moodle.outputs.release }}-web
          cache-from: type=gha
          cache-to: type=gha,mode=max